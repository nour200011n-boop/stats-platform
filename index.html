<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصة التحليل الإحصائي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Markazi+Text:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF1EC;
  --card:#FFFFFF;
  --ink:#1C2620;
  --ink-soft:#55625A;
  --line:#D3D9CE;
  --primary:#1F6F5C;
  --primary-dark:#154F41;
  --primary-soft:#E4EEE9;
  --accent:#B8862B;
  --accent-soft:#F5ECD8;
  --danger:#A23E3E;
  --danger-soft:#F5E4E1;
  --radius:6px;
  --font-display:'Markazi Text',serif;
  --font-body:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;
  --font-mono:'IBM Plex Mono','Consolas',monospace;
}
*{box-sizing:border-box;}
html{direction:rtl;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.6;}
h1,h2,h3{font-family:var(--font-display);font-weight:600;margin:0 0 .5rem;color:var(--ink);}
h1{font-size:2rem;}
h2{font-size:1.35rem;}
p{margin:.4rem 0;}
.mono{font-family:var(--font-mono);}
.muted{color:var(--ink-soft);}
a{color:var(--primary-dark);}
button{font-family:inherit;cursor:pointer;}
input,select{font-family:inherit;font-size:1rem;}

.grid-bg{
  background-image:linear-gradient(var(--line) 1px, transparent 1px),linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size:28px 28px;background-color:var(--paper);
}
.center-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;color:var(--ink-soft);}
.spinner{width:32px;height:32px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--primary);animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

.auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem;}
.auth-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:2.5rem 2rem;max-width:400px;width:100%;text-align:center;}
.auth-card.wide{max-width:520px;text-align:right;}
.brand-mark{width:56px;height:56px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:1.8rem;margin:0 auto 1rem;}
.brand-mark.small{width:32px;height:32px;font-size:1.1rem;}
.auth-title{margin-bottom:.4rem;}
.auth-sub{color:var(--ink-soft);margin-bottom:1.5rem;}

.btn{border:1px solid var(--primary);background:var(--primary);color:#fff;padding:.65rem 1.2rem;border-radius:var(--radius);font-size:.95rem;font-weight:600;transition:background .15s ease, transform .05s ease;}
.btn:hover{background:var(--primary-dark);}
.btn:active{transform:translateY(1px);}
.btn:focus-visible{outline:2px solid var(--primary-dark);outline-offset:2px;}
.btn-block{width:100%;}
.btn-outline{background:transparent;color:var(--primary-dark);}
.btn-outline:hover{background:var(--primary-soft);}
.btn-ghost{background:transparent;border-color:transparent;color:var(--ink-soft);}
.btn-ghost:hover{background:var(--primary-soft);color:var(--ink);}
.btn-danger{background:var(--danger);border-color:var(--danger);}
.btn-danger:hover{background:#832f2f;}
.btn-sm{padding:.35rem .7rem;font-size:.85rem;}
.btn:disabled{opacity:.6;cursor:not-allowed;}

.stacked-form{display:flex;flex-direction:column;gap:1rem;}
.stacked-form label{display:flex;flex-direction:column;gap:.35rem;font-size:.9rem;color:var(--ink-soft);}
.stacked-form input,.inline-form input{border:1px solid var(--line);border-radius:var(--radius);padding:.6rem .7rem;background:#fff;color:var(--ink);font-size:1rem;}
.stacked-form input:focus-visible,.inline-form input:focus-visible{outline:2px solid var(--primary);outline-offset:1px;}
.inline-form{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;}

.app-shell{min-height:100vh;display:flex;flex-direction:column;}
.app-shell.with-sidebar{flex-direction:row;}
.topbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;padding:1rem 1.5rem;background:var(--card);border-bottom:1px solid var(--line);}
.brand{display:flex;align-items:center;gap:.6rem;font-weight:600;}
.tabbar{display:flex;gap:.4rem;flex-wrap:wrap;}
.tab{background:transparent;border:1px solid transparent;padding:.5rem 1rem;border-radius:var(--radius);color:var(--ink-soft);font-weight:600;}
.tab.active{background:var(--primary-soft);color:var(--primary-dark);border-color:var(--primary-soft);}
.user-chip{display:flex;align-items:center;gap:.8rem;font-size:.9rem;}

.sidebar{width:230px;flex-shrink:0;background:var(--card);border-left:1px solid var(--line);padding:1.5rem 1rem;display:flex;flex-direction:column;gap:1.5rem;}
.side-tabbar{display:flex;flex-direction:column;gap:.3rem;}
.side-tab{text-align:right;background:transparent;border:none;padding:.6rem .8rem;border-radius:var(--radius);color:var(--ink-soft);font-weight:600;}
.side-tab.active{background:var(--primary-soft);color:var(--primary-dark);}
.logout-btn{margin-top:auto;}

.content{flex:1;padding:1.5rem;max-width:1100px;margin:0 auto;width:100%;}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:1.5rem;margin-bottom:1.5rem;}
.form-card{max-width:640px;}

.form-step{display:flex;gap:1rem;align-items:flex-start;padding:1rem 0;border-bottom:1px solid var(--line);}
.form-step:last-child{border-bottom:none;}
.step-num{width:28px;height:28px;flex-shrink:0;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-weight:600;}
.field-label{display:block;font-weight:600;margin-bottom:.5rem;}

.check-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:.5rem;}
.check-item{display:flex;align-items:center;gap:.5rem;font-size:.9rem;}
.chart-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:.8rem;}
.chart-item{border:1px solid var(--line);border-radius:var(--radius);padding:.5rem;text-align:center;font-size:.8rem;display:flex;flex-direction:column;gap:.4rem;cursor:pointer;}
.chart-item img{width:100%;height:70px;object-fit:cover;border-radius:4px;}
.chart-item:has(input:checked){border-color:var(--primary);background:var(--primary-soft);}

.method-tabs{display:flex;gap:1rem;margin-bottom:.8rem;flex-wrap:wrap;}
.drive-link-input{width:100%;}
.stat-grid{display:flex;flex-direction:column;gap:.5rem;}
.stat-item{display:flex;align-items:center;gap:.6rem;border:1px solid var(--line);border-radius:var(--radius);padding:.5rem .7rem;}
.stat-item:has(input:checked){border-color:var(--primary);background:var(--primary-soft);}

.discount-note{color:var(--accent);font-weight:600;}

.orders-list{display:flex;flex-direction:column;gap:1.2rem;}
.order-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;}
.order-body p{font-size:.92rem;}

.badge{display:inline-block;padding:.25rem .7rem;border-radius:20px;font-size:.8rem;font-weight:600;}
.badge-pending{background:#EEE7D6;color:#7A5C1E;}
.badge-awaiting_payment{background:var(--danger-soft);color:var(--danger);}
.badge-in_analysis{background:#DDEAF5;color:#2B5F84;}
.badge-completed{background:var(--primary-soft);color:var(--primary-dark);}

.stepper{display:flex;align-items:center;margin:1rem 0;}
.step{display:flex;flex-direction:column;align-items:center;gap:.3rem;flex:1;min-width:0;}
.step-dot{width:14px;height:14px;border-radius:50%;background:var(--line);}
.step.done .step-dot,.step.current .step-dot{background:var(--primary);}
.step-label{font-size:.7rem;color:var(--ink-soft);text-align:center;}
.step.done .step-label,.step.current .step-label{color:var(--ink);font-weight:600;}
.step-line{flex:1;height:2px;background:var(--line);margin-bottom:1.1rem;}
.step-line.done{background:var(--primary);}

.settings-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1.5rem;align-items:start;}
.referral-code-row{display:flex;align-items:center;gap:.6rem;}
.referral-code{background:var(--accent-soft);color:var(--accent);padding:.4rem .8rem;border-radius:var(--radius);font-weight:600;}
.progress-track{background:var(--line);border-radius:20px;height:10px;overflow:hidden;margin:.4rem 0;}
.progress-fill{background:var(--accent);height:100%;transition:width .3s ease;}
.badge-line{color:var(--accent);font-weight:600;}

.stats-grid{display:flex;gap:1.5rem;flex-wrap:wrap;align-items:center;}
.stat-card{display:flex;flex-direction:column;gap:.3rem;min-width:150px;}
.stat-number{font-size:2.4rem;font-weight:600;color:var(--primary-dark);}
.stat-label{color:var(--ink-soft);font-size:.9rem;}

.table-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;}
.ledger-table{width:100%;border-collapse:collapse;font-size:.9rem;}
.ledger-table th{text-align:right;color:var(--ink-soft);font-weight:600;padding:.6rem .5rem;border-bottom:2px solid var(--line);}
.ledger-table td{padding:.7rem .5rem;border-bottom:1px solid var(--line);}

.manage-list{list-style:none;margin:0 0 1rem;padding:0;display:flex;flex-direction:column;gap:.5rem;}
.manage-list li{display:flex;justify-content:space-between;align-items:center;padding:.5rem 0;border-bottom:1px solid var(--line);gap:.5rem;flex-wrap:wrap;}
.row-actions{display:flex;gap:.4rem;}
.chart-manage-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:1rem;margin-bottom:1rem;}
.chart-manage-item{border:1px solid var(--line);border-radius:var(--radius);padding:.5rem;text-align:center;font-size:.8rem;display:flex;flex-direction:column;gap:.4rem;}
.chart-manage-item img{width:100%;height:70px;object-fit:cover;border-radius:4px;}

.empty-state{text-align:center;padding:3rem 1rem;color:var(--ink-soft);}

.modal-backdrop{position:fixed;inset:0;background:rgba(28,38,32,.55);display:flex;align-items:center;justify-content:center;padding:1rem;z-index:50;}
.modal-box{background:var(--card);border-radius:var(--radius);padding:2rem;max-width:520px;width:100%;max-height:85vh;overflow-y:auto;position:relative;}
.modal-close{position:absolute;top:.8rem;left:.8rem;background:transparent;border:none;font-size:1.2rem;color:var(--ink-soft);}
.modal-actions{display:flex;flex-direction:column;gap:.8rem;margin-top:1.2rem;border-top:1px solid var(--line);padding-top:1.2rem;}

.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.7rem 1.4rem;border-radius:var(--radius);font-size:.9rem;z-index:100;}
.toast-error{background:var(--danger);}
.toast-success{background:var(--primary-dark);}

.setup-screen{min-height:100vh;padding:2rem 1rem;}
.setup-box{max-width:720px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:2rem;}
.setup-box pre{background:#F5F6F2;border:1px solid var(--line);border-radius:var(--radius);padding:1rem;overflow-x:auto;font-family:var(--font-mono);font-size:.78rem;direction:ltr;text-align:left;}
.setup-box ol{padding-inline-start:1.4rem;}
.setup-box li{margin-bottom:.6rem;}
.setup-note{background:var(--accent-soft);border-radius:var(--radius);padding:.8rem 1rem;color:#7A5C1E;font-size:.9rem;}
.setup-box h3{margin-top:1.6rem;}

@media (max-width:768px){
  .app-shell.with-sidebar{flex-direction:column;}
  .sidebar{width:100%;flex-direction:row;overflow-x:auto;border-left:none;border-bottom:1px solid var(--line);align-items:center;}
  .side-tabbar{flex-direction:row;}
  .logout-btn{margin-top:0;margin-right:auto;}
  .content{padding:1rem;}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important;}
}
</style>

<body>
<noscript>هذا التطبيق يحتاج إلى تفعيل JavaScript في المتصفح.</noscript>
<div id="app"><div class="center-screen"><div class="spinner"></div><p>جارٍ التحميل...</p></div></div>

<script type="module">
/* ============================================================
   استيراد Firebase (SDK إصدار 10 - Modular)
   ملاحظة: لا يستخدم هذا الملف Firebase Storage إطلاقاً (يتطلب خطة
   Blaze المدفوعة وربط بطاقة بنكية). بدلاً منه، ملفات الطلبات تُرسل
   عبر رابط Google Drive يضعه العميل، أو مباشرة عبر تلكرام لأحد
   الإحصائيين الذين يضيفهم المالك.
   ============================================================ */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, doc, getDoc, setDoc, updateDoc, addDoc, collection, query, where,
  orderBy, getDocs, onSnapshot, serverTimestamp, runTransaction, getCountFromServer,
  enableIndexedDbPersistence
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ============================================================
   1) إعدادات المشروع
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyC7VVvo57P_y2ndWRLo4kmt2TkisT4KmN4",
  authDomain: "stats-analysis-platform.firebaseapp.com",
  projectId: "stats-analysis-platform",
  storageBucket: "stats-analysis-platform.firebasestorage.app",
  messagingSenderId: "347756276194",
  appId: "1:347756276194:web:eb2f0162373a075430b1bb",
  measurementId: "G-XWYP786WVQ"
};
const ADMIN_EMAIL = "nour200011j@gmail.com";
const NEEDS_SETUP = firebaseConfig.apiKey === "YOUR_API_KEY";

const STATUS_LABELS = {
  pending: "قيد الانتظار",
  awaiting_payment: "بانتظار الدفع",
  in_analysis: "قيد التحليل",
  completed: "مكتمل"
};
const STATUS_ORDER = ["pending", "awaiting_payment", "in_analysis", "completed"];

const FIRESTORE_RULES = `rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    function isSignedIn() { return request.auth != null; }
    function isAdmin() { return isSignedIn() && request.auth.token.email == 'nour200011j@gmail.com'; }
    function isOwner(uid) { return isSignedIn() && request.auth.uid == uid; }

    match /app_settings/{docId} {
      allow read: if isSignedIn();
      allow write: if isAdmin();
    }

    match /users/{uid} {
      allow read: if isSignedIn();
      allow create: if isOwner(uid);
      allow update: if isOwner(uid) || isAdmin() ||
        (isSignedIn() && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['currentDiscountPercent', 'updatedAt']));
      allow delete: if false;
    }

    match /orders/{orderId} {
      allow create: if isSignedIn() && request.resource.data.userId == request.auth.uid
                     && request.resource.data.status == 'pending';
      allow read: if isSignedIn() && (resource.data.userId == request.auth.uid || isAdmin());
      allow update: if isAdmin();
      allow delete: if isAdmin();
    }
  }
}`;

/* ============================================================
   2) الحالة العامة للتطبيق (State)
   ============================================================ */
const $app = document.getElementById("app");
let app, auth, db, googleProvider;

const state = {
  user: null,
  userDoc: null,
  appSettings: null,
  isAdmin: false,
  view: "loading",
  clientTab: "new-order",
  adminTab: "stats",
  orders: [],
  adminStats: null,
  adminUsers: [],
  modal: null,
  toast: null,
  ordersUnsub: null,
  initError: null
};

/* ============================================================
   3) أدوات مساعدة عامة (Utilities)
   ============================================================ */
function escapeHtml(str) {
  if (str === null || str === undefined) return "";
  return String(str).replace(/[&<>"']/g, s => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[s]));
}
function formatDate(ts) {
  if (!ts) return "—";
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  if (isNaN(d.getTime())) return "—";
  return d.toLocaleString("ar-u-nu-latn", { year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit" });
}
function isHttpUrl(v) { return typeof v === "string" && /^https?:\/\/.+/i.test(v.trim()); }
function testNameById(id) { return (state.appSettings?.tests || []).find(t => t.id === id)?.name || id; }
function chartNameById(id) { return (state.appSettings?.charts || []).find(c => c.id === id)?.name || id; }

function showToast(msg, type) {
  state.toast = { msg, type: type || "info" };
  render();
  setTimeout(() => { if (state.toast && state.toast.msg === msg) { state.toast = null; render(); } }, 4000);
}

/* ============================================================
   4) تهيئة Firebase
   ============================================================ */
function initFirebase() {
  app = initializeApp(firebaseConfig);
  auth = getAuth(app);
  db = getFirestore(app);
  googleProvider = new GoogleAuthProvider();
  try { enableIndexedDbPersistence(db); } catch (e) { /* متعدد التبويبات أو غير مدعوم - نتجاهل */ }
}

async function signIn() {
  try { await signInWithPopup(auth, googleProvider); }
  catch (err) { showToast("تعذر تسجيل الدخول: " + err.message, "error"); }
}
async function doSignOut() {
  cleanupOrdersListener();
  await signOut(auth);
}

function cleanupOrdersListener() {
  if (state.ordersUnsub) { state.ordersUnsub(); state.ordersUnsub = null; }
}

/* ============================================================
   5) بيانات التطبيق (app_settings / users)
   ============================================================ */
async function fetchAppSettings() {
  const ref = doc(db, "app_settings", "main");
  const snap = await getDoc(ref);
  if (snap.exists()) return snap.data();
  const defaults = {
    globalMaxDiscount: 50, referralSenderPercent: 5, referralReceiverPercent: 10,
    tests: [], charts: [], registrationFields: [], statisticians: []
  };
  try { await setDoc(ref, defaults); } catch (e) { /* ignore */ }
  return defaults;
}

async function generateUniqueReferralCode(name) {
  const base = (name || "USER").replace(/[^a-zA-Z0-9\u0600-\u06FF]/g, "").slice(0, 3).toUpperCase() || "USR";
  for (let i = 0; i < 5; i++) {
    const candidate = base + Math.random().toString(36).slice(2, 6).toUpperCase();
    const q = query(collection(db, "users"), where("referralCode", "==", candidate));
    const snap = await getDocs(q);
    if (snap.empty) return candidate;
  }
  return base + Date.now().toString(36).toUpperCase();
}

async function ensureUserDoc(user) {
  const uRef = doc(db, "users", user.uid);
  const snap = await getDoc(uRef);
  if (snap.exists()) return snap.data();
  const code = await generateUniqueReferralCode(user.displayName || "user");
  const data = {
    uid: user.uid, email: user.email, displayName: user.displayName || "", photoURL: user.photoURL || "",
    name: "", age: "", college: "", phone: "", customFields: {},
    referralCode: code, referralUsedCode: null,
    currentDiscountPercent: 0, lockCount: 0,
    ordersUploadedCount: 0, ordersReceivedCount: 0,
    createdAt: serverTimestamp(), updatedAt: serverTimestamp()
  };
  await setDoc(uRef, data);
  return { ...data, createdAt: new Date(), updatedAt: new Date() };
}

function isProfileComplete(u) {
  if (!u) return false;
  if (!(u.name && u.age && u.college && u.phone)) return false;
  const extra = state.appSettings?.registrationFields || [];
  for (const f of extra) {
    if (f.required && !(u.customFields && u.customFields[f.id])) return false;
  }
  return true;
}

async function saveRegistration(values) {
  const uRef = doc(db, "users", state.user.uid);
  const update = {
    name: values.name, age: values.age, college: values.college, phone: values.phone,
    customFields: values.customFields || {}, updatedAt: serverTimestamp()
  };
  await updateDoc(uRef, update);
  state.userDoc = { ...state.userDoc, ...update };
}

/* ============================================================
   6) نظام الإحالة الديناميكي
   ملاحظة تصميم: تم توحيد "نسبة الخصم" في حقل واحد currentDiscountPercent
   لكل مستخدم، يُستخدم سواء كمرسل (يزيد بإحالة آخرين) أو كمستلم (يزيد
   لمرة واحدة عند استخدام كود). هذا يبسّط شريط التقدم مع الحفاظ على
   نفس القواعد المطلوبة في الوصف (حد أقصى، تعطل عند الوصول للحد، تصفير
   بعد اكتمال الطلب).
   ============================================================ */
async function redeemReferralCode(rawCode) {
  const code = (rawCode || "").trim().toUpperCase();
  if (!code) throw new Error("أدخل كوداً صالحاً");
  if (state.userDoc.referralUsedCode) throw new Error("لقد استخدمت كوداً من قبل");
  if (code === state.userDoc.referralCode) throw new Error("لا يمكنك استخدام كودك الخاص");

  const q = query(collection(db, "users"), where("referralCode", "==", code));
  const snap = await getDocs(q);
  if (snap.empty) throw new Error("الكود غير صحيح");
  const senderDocRef = snap.docs[0].ref;
  const receiverRef = doc(db, "users", state.user.uid);
  const settingsRef = doc(db, "app_settings", "main");

  await runTransaction(db, async (tx) => {
    const settingsSnap = await tx.get(settingsRef);
    const senderSnap = await tx.get(senderDocRef);
    const receiverSnap = await tx.get(receiverRef);
    if (!senderSnap.exists() || !receiverSnap.exists()) throw new Error("تعذر إتمام العملية");
    const settings = settingsSnap.data() || {};
    const receiverData = receiverSnap.data();
    if (receiverData.referralUsedCode) throw new Error("لقد استخدمت كوداً من قبل");
    const senderData = senderSnap.data();
    const max = settings.globalMaxDiscount ?? 50;

    const newReceiverDiscount = Math.min((receiverData.currentDiscountPercent || 0) + (settings.referralReceiverPercent || 0), max);
    tx.update(receiverRef, { referralUsedCode: code, currentDiscountPercent: newReceiverDiscount, updatedAt: serverTimestamp() });

    if ((senderData.currentDiscountPercent || 0) < max) {
      const newSenderDiscount = Math.min((senderData.currentDiscountPercent || 0) + (settings.referralSenderPercent || 0), max);
      tx.update(senderDocRef, { currentDiscountPercent: newSenderDiscount, updatedAt: serverTimestamp() });
    }
  });

  const freshSnap = await getDoc(receiverRef);
  state.userDoc = freshSnap.data();
}

async function settleClientDiscount(userId, appliedDiscountPercent) {
  const uRef = doc(db, "users", userId);
  const settingsRef = doc(db, "app_settings", "main");
  await runTransaction(db, async (tx) => {
    const snap = await tx.get(uRef);
    if (!snap.exists()) return;
    const u = snap.data();
    const settingsSnap = await tx.get(settingsRef);
    const max = settingsSnap.data()?.globalMaxDiscount ?? 50;
    const update = {
      currentDiscountPercent: 0,
      ordersReceivedCount: (u.ordersReceivedCount || 0) + 1,
      updatedAt: serverTimestamp()
    };
    if ((appliedDiscountPercent || 0) >= max && max > 0) {
      update.lockCount = (u.lockCount || 0) + 1;
    }
    tx.update(uRef, update);
  });
}

/* ============================================================
   7) معالجة صور الأشكال البيانية محلياً (ضغط ثم تحويل لـ base64)
   لا حاجة لـ Storage: نضغط الصورة داخل المتصفح ونخزنها كنص base64
   ضمن مستند app_settings مباشرة (الصور صغيرة جداً بعد الضغط).
   ============================================================ */
function fileToCompressedDataUrl(file, maxWidth, quality) {
  maxWidth = maxWidth || 240; quality = quality || 0.55;
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("تعذرت قراءة الصورة"));
    reader.onload = (e) => { img.src = e.target.result; };
    img.onerror = () => reject(new Error("تعذر تحميل الصورة"));
    img.onload = () => {
      const scale = Math.min(1, maxWidth / img.width);
      const canvas = document.createElement("canvas");
      canvas.width = Math.max(1, Math.round(img.width * scale));
      canvas.height = Math.max(1, Math.round(img.height * scale));
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      resolve(canvas.toDataURL("image/jpeg", quality));
    };
    reader.readAsDataURL(file);
  });
}

/* ============================================================
   8) الطلبات (Orders) - عميل
   طريقة إرسال الملف: رابط Google Drive أو تواصل مباشر مع إحصائي
   عبر تلكرام (بدون رفع أي ملف عبر التطبيق نفسه).
   ============================================================ */
function validateFileDelivery(method, driveLink, statisticianId) {
  if (method === "drive") {
    if (!isHttpUrl(driveLink)) throw new Error("الصق رابط Google Drive صحيح (يبدأ بـ http)");
  } else if (method === "telegram") {
    if (!statisticianId) throw new Error("اختر أحد الإحصائيين للتواصل معه");
  } else {
    throw new Error("اختر طريقة إرسال الملف");
  }
}

async function submitOrder({ fileMethod, driveLink, statisticianId, selectedTests, selectedCharts }) {
  validateFileDelivery(fileMethod, driveLink, statisticianId);
  let statisticianName = null;
  if (fileMethod === "telegram") {
    const s = (state.appSettings.statisticians || []).find(x => x.id === statisticianId);
    if (!s) throw new Error("الإحصائي المختار لم يعد متاحاً، اختر غيره");
    statisticianName = s.name;
  }
  const orderData = {
    userId: state.user.uid,
    clientSnapshot: { name: state.userDoc.name, phone: state.userDoc.phone, college: state.userDoc.college, email: state.user.email },
    fileMethod,
    driveLink: fileMethod === "drive" ? driveLink.trim() : null,
    statisticianId: fileMethod === "telegram" ? statisticianId : null,
    statisticianName: fileMethod === "telegram" ? statisticianName : null,
    finalLink: null,
    selectedTests: selectedTests || [], selectedCharts: selectedCharts || [],
    status: "pending", paymentReceived: false,
    appliedDiscountPercent: state.userDoc.currentDiscountPercent || 0,
    uploadedAt: serverTimestamp(), approvedAt: null, deliveredAt: null
  };
  await addDoc(collection(db, "orders"), orderData);
  await updateDoc(doc(db, "users", state.user.uid), { ordersUploadedCount: (state.userDoc.ordersUploadedCount || 0) + 1 });
  state.userDoc.ordersUploadedCount = (state.userDoc.ordersUploadedCount || 0) + 1;
}

function listenMyOrders() {
  cleanupOrdersListener();
  const q = query(collection(db, "orders"), where("userId", "==", state.user.uid));
  state.ordersUnsub = onSnapshot(q, (snap) => {
    const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    list.sort((a, b) => {
      const at = a.uploadedAt?.toMillis ? a.uploadedAt.toMillis() : 0;
      const bt = b.uploadedAt?.toMillis ? b.uploadedAt.toMillis() : 0;
      return bt - at;
    });
    state.orders = list;
    if (state.view === "client") render();
  }, (err) => showToast("تعذر تحديث الطلبات: " + err.message, "error"));
}

async function fetchAllOrdersAdmin() {
  const q = query(collection(db, "orders"), orderBy("uploadedAt", "desc"));

  state.orders = snap.docs.map(d => ({ id: d.id, ...d.data() }));

async function approveOrder(orderId) {
  await updateDoc(doc(db, "orders", orderId), { status: "awaiting_payment", approvedAt: serverTimestamp() });
  const o = state.orders.find(x => x.id === orderId);
  if (o) o.status = "awaiting_payment";
}

async function togglePayment(orderId, checked) {
  const o = state.orders.find(x => x.id === orderId);
  if (!o) return;
  const update = { paymentReceived: checked };
  if (checked && o.status === "awaiting_payment") update.status = "in_analysis";
  if (!checked && o.status === "in_analysis") update.status = "awaiting_payment";
  await updateDoc(doc(db, "orders", orderId), update);
  Object.assign(o, update);
}

async function deliverOrder(orderId, finalLink) {
  const o = state.orders.find(x => x.id === orderId);
  if (!o) return;
  if (!finalLink || !finalLink.trim()) throw new Error("أدخل رابط الملف النهائي أو ملاحظة التسليم");
  const update = { finalLink: finalLink.trim(), status: "completed", deliveredAt: serverTimestamp() };
  await updateDoc(doc(db, "orders", orderId), update);
  Object.assign(o, update);
  await settleClientDiscount(o.userId, o.appliedDiscountPercent);
}

  html += "</div>";

/* ============================================================
   12) معالجة الأحداث (Event delegation)
   ============================================================ */
async function onAppSubmit(e) {
  const form = e.target.closest("[data-form]");
  if (!form) return;
  e.preventDefault();
  const kind = form.dataset.form;

  if (kind === "register") {
    const fd = new FormData(form);
    const customFields = {};
    (state.appSettings?.registrationFields || []).forEach(f => { customFields[f.id] = fd.get("cf_" + f.id) || ""; });
    try {
      await saveRegistration({ name: fd.get("name"), age: fd.get("age"), college: fd.get("college"), phone: fd.get("phone"), customFields });
      state.view = "client";
      render();
      listenMyOrders();
    } catch (err) { showToast(err.message, "error"); }
    return;
  }

  if (kind === "profile") {
    const fd = new FormData(form);
    try {
      await saveRegistration({ name: fd.get("name"), age: fd.get("age"), college: fd.get("college"), phone: fd.get("phone"), customFields: state.userDoc.customFields || {} });
      showToast("تم حفظ التعديلات", "success");
    } catch (err) { showToast(err.message, "error"); }
    return;
  }

  if (kind === "redeem-code") {
    const fd = new FormData(form);
    try {
      await redeemReferralCode(fd.get("code"));
      showToast("تم تفعيل الكود بنجاح", "success");
      render();
    } catch (err) { showToast(err.message, "error"); }
    return;
  }

  if (kind === "new-order") {
    const fd = new FormData(form);
    const fileMethod = fd.get("fileMethod");
    const driveLink = fd.get("driveLink");
    const statisticianId = fd.get("statisticianId");
    const selectedTests = fd.getAll("tests");
    const selectedCharts = fd.getAll("charts");
    const submitBtn = form.querySelector("button[type=submit]");
    try {
      submitBtn.disabled = true; submitBtn.textContent = "جارٍ الإرسال...";
      await submitOrder({ fileMethod, driveLink, statisticianId, selectedTests, selectedCharts });
      showToast("تم إرسال الطلب بنجاح", "success");
      state.clientTab = "my-orders";
      render();
    } catch (err) {
      showToast(err.message, "error");
      submitBtn.disabled = false; submitBtn.textContent = "إرسال الطلب";
    }
    return;
  }

  if (kind === "admin-add-test") {
    const fd = new FormData(form);
    try { await saveTests(addTestLocal(fd.get("name"))); render(); }
    catch (err) { showToast(err.message, "error"); }
    return;
  }

  if (kind === "admin-add-chart") {
    const fd = new FormData(form);
    const file = fd.get("image");
    const name = fd.get("name");
    const submitBtn = form.querySelector("button[type=submit]");
    try {
      submitBtn.disabled = true; submitBtn.textContent = "جارٍ المعالجة...";
      await addChartAdmin(file, name);
      render();
    } catch (err) {
      showToast(err.message, "error");
      submitBtn.disabled = false; submitBtn.textContent = "رفع";
    }
    return;
  }

  if (kind === "admin-add-regfield") {
    const fd = new FormData(form);
    const fields = [...(state.appSettings.registrationFields || [])];
    fields.push({ id: "f_" + Date.now(), label: fd.get("label"), required: fd.get("required") === "on" });
    try {
      await updateDoc(doc(db, "app_settings", "main"), { registrationFields: fields });
      state.appSettings.registrationFields = fields;
      render();
    } catch (err) { showToast(err.message, "error"); }
    return;
  }

  if (kind === "admin-add-statistician") {
    const fd = new FormData(form);
    const link = (fd.get("link") || "").trim();
    if (!isHttpUrl(link)) { showToast("أدخل رابط تلكرام صحيح يبدأ بـ http", "error"); return; }
    try {
      await saveStatisticians(addStatisticianLocal(fd.get("name"), link));
      render();
    } catch (err) { showToast(err.message, "error"); }
    return;
  }

  if (kind === "admin-referral-settings") {
    const fd = new FormData(form);
    try {
      await saveGlobalSettings({
        globalMaxDiscount: Number(fd.get("globalMaxDiscount")),
        referralSenderPercent: Number(fd.get("referralSenderPercent")),
        referralReceiverPercent: Number(fd.get("referralReceiverPercent"))
      });
      showToast("تم حفظ الإعدادات", "success");
    } catch (err) { showToast(err.message, "error"); }
    return;
  }

  if (kind === "deliver-order") {
    const fd = new FormData(form);
    const orderId = form.dataset.orderId;
    try {
      await deliverOrder(orderId, fd.get("finalLink"));
      showToast("تم تسليم الطلب", "success");
      render();
    } catch (err) { showToast(err.message, "error"); }
    return;
  }
}

function onAppClick(e) {
  if (e.target.classList && e.target.classList.contains("modal-backdrop")) {
    state.modal = null; render(); return;
  }
  const btn = e.target.closest("[data-action]");
  if (!btn) return;
  const action = btn.dataset.action;

  if (action === "login") { signIn(); return; }
  if (action === "logout") { doSignOut(); return; }
  if (action === "set-client-tab") { state.clientTab = btn.dataset.tab; render(); return; }
  if (action === "set-admin-tab") {
    state.adminTab = btn.dataset.tab; render();
    if (btn.dataset.tab === "orders") fetchAllOrdersAdmin().then(render).catch(err => showToast(err.message, "error"));
    if (btn.dataset.tab === "stats") loadAdminStats().then(s => { state.adminStats = s; render(); }).catch(err => showToast(err.message, "error"));
    if (btn.dataset.tab === "badges") loadBadgeUsers().then(u => { state.adminUsers = u; render(); }).catch(err => showToast(err.message, "error"));
    return;
  }
  if (action === "copy-referral") {
    navigator.clipboard?.writeText(state.userDoc.referralCode).then(() => showToast("تم نسخ الكود", "success")).catch(() => {});
    return;
  }
  if (action === "copy-text") {
    const target = document.getElementById(btn.dataset.copyId);
    if (target) navigator.clipboard?.writeText(target.textContent).then(() => showToast("تم النسخ", "success")).catch(() => {});
    return;
  }
  if (action === "open-order-modal") { state.modal = btn.dataset.id; render(); return; }
  if (action === "close-modal") { state.modal = null; render(); return; }
  if (action === "approve-order") { approveOrder(btn.dataset.id).then(render).catch(err => showToast(err.message, "error")); return; }
  if (action === "toggle-test") {
    const tests = (state.appSettings.tests || []).map(t => t.id === btn.dataset.id ? { ...t, enabled: !t.enabled } : t);
    saveTests(tests).then(render).catch(err => showToast(err.message, "error"));
    return;
  }
  if (action === "remove-test") {
    const tests = (state.appSettings.tests || []).filter(t => t.id !== btn.dataset.id);
    saveTests(tests).then(render).catch(err => showToast(err.message, "error"));
    return;
  }
  if (action === "toggle-chart") { toggleChartLocalAndSave(btn.dataset.id).then(render).catch(err => showToast(err.message, "error")); return; }
  if (action === "remove-chart") { removeChartAdmin(btn.dataset.id).then(render).catch(err => showToast(err.message, "error")); return; }
  if (action === "remove-regfield") {
    const fields = (state.appSettings.registrationFields || []).filter(f => f.id !== btn.dataset.id);
    updateDoc(doc(db, "app_settings", "main"), { registrationFields: fields }).then(() => { state.appSettings.registrationFields = fields; render(); }).catch(err => showToast(err.message, "error"));
    return;
  }
  if (action === "toggle-statistician") {
    const list = (state.appSettings.statisticians || []).map(s => s.id === btn.dataset.id ? { ...s, active: !s.active } : s);
    saveStatisticians(list).then(render).catch(err => showToast(err.message, "error"));
    return;
  }
  if (action === "remove-statistician") {
    const list = (state.appSettings.statisticians || []).filter(s => s.id !== btn.dataset.id);
    saveStatisticians(list).then(render).catch(err => showToast(err.message, "error"));
    return;
  }
  if (action === "refresh-admin-orders") { fetchAllOrdersAdmin().then(render).catch(err => showToast(err.message, "error")); return; }
  if (action === "refresh-admin-stats") { loadAdminStats().then(s => { state.adminStats = s; render(); }).catch(err => showToast(err.message, "error")); return; }
  if (action === "refresh-badges") { loadBadgeUsers().then(u => { state.adminUsers = u; render(); }).catch(err => showToast(err.message, "error")); return; }
}

function onAppChange(e) {
  const t = e.target;
  if (t.name === "fileMethod") {
    const form = t.closest("form");
    if (!form) return;
    const drivePanel = form.querySelector('[data-method-panel="drive"]');
    const tgPanel = form.querySelector('[data-method-panel="telegram"]');
    if (drivePanel) drivePanel.hidden = (t.value !== "drive");
    if (tgPanel) tgPanel.hidden = (t.value !== "telegram");
    return;
  }
  if (t.dataset.paymentToggle) {
    const id = t.dataset.paymentToggle;
    const wasChecked = t.checked;
    togglePayment(id, wasChecked).then(render).catch(err => { showToast(err.message, "error"); t.checked = !wasChecked; });
  }
}

$app.addEventListener("click", onAppClick);
$app.addEventListener("submit", onAppSubmit);
$app.addEventListener("change", onAppChange);

/* ============================================================
   13) تسجيل الدخول وتوجيه الشاشات
   ============================================================ */
async function handleAuthChange(user) {
  cleanupOrdersListener();
  if (!user) {
    state.user = null; state.userDoc = null; state.isAdmin = false; state.orders = [];
    state.view = "login";
    render();
    return;
  }
  state.user = user;
  state.isAdmin = (user.email === ADMIN_EMAIL);
  state.view = "loading";
  render();
  try {
    if (!state.appSettings) state.appSettings = await fetchAppSettings();
    state.userDoc = await ensureUserDoc(user);
  } catch (err) {
    showToast("تعذر تحميل البيانات: " + err.message, "error");
    return;
  }
  if (state.isAdmin) {
    state.view = "admin";
    render();
    loadAdminStats().then(s => { state.adminStats = s; if (state.view === "admin" && state.adminTab === "stats") render(); }).catch(() => {});
  } else if (!isProfileComplete(state.userDoc)) {
    state.view = "register";
    render();
  } else {
    state.view = "client";
    render();
    listenMyOrders();
  }
}

/* ============================================================
   14) الإقلاع
   ============================================================ */
function boot() {
  if (NEEDS_SETUP) { state.view = "setup"; render(); return; }
  try {
    initFirebase();
    onAuthStateChanged(auth, handleAuthChange);
  } catch (err) {
    state.view = "setup"; state.initError = err.message; render();
  }
}
boot();
