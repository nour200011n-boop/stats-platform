<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة الإدارة العليا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0F6E56">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
  .tabs{display:flex; gap:8px; overflow-x:auto; padding-bottom:12px; margin-bottom:18px; border-bottom:1px solid var(--line);}
  .tab-btn{flex-shrink:0; height:38px; padding:0 16px; border-radius:100px; border:1px solid var(--line); background:var(--surface); color:var(--ink-soft); font-weight:700; font-size:13.5px; cursor:pointer; white-space:nowrap;}
  .tab-btn.active{background:var(--primary); border-color:var(--primary); color:#fff;}
  .mini-form{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:18px;}
  .switch{position:relative; width:42px; height:24px; flex-shrink:0;}
  .switch input{opacity:0; width:0; height:0;}
  .switch-track{position:absolute; inset:0; background:var(--line); border-radius:100px; cursor:pointer; transition:.15s;}
  .switch-track:before{content:""; position:absolute; width:18px; height:18px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.15s;}
  .switch input:checked + .switch-track{background:var(--primary);}
  html[dir="rtl"] .switch input:checked + .switch-track:before{transform:translateX(-18px);}
  html[dir="ltr"] .switch input:checked + .switch-track:before{transform:translateX(18px);}
  .avatar{width:40px; height:40px; border-radius:50%; background:var(--primary-tint); color:var(--primary-dark); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-mark">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
      </div>
      <span>لوحة الإدارة العليا</span>
    </div>
    <div style="flex:1;"></div>
    <button class="btn btn-danger-ghost" id="logoutBtn">خروج</button>
  </div>
</div>

<main>
  <div class="tabs" id="tabBar">
    <button class="tab-btn active" data-tab="dashboard">الإحصائيات</button>
    <button class="tab-btn" data-tab="pharmacies">الصيدليات</button>
    <button class="tab-btn" data-tab="plans">الخطط والتفعيل</button>
    <button class="tab-btn" data-tab="features">الميزات</button>
    <button class="tab-btn" data-tab="access">استمرارية البرنامج</button>
    <button class="tab-btn" data-tab="ads">الإعلانات</button>
    <button class="tab-btn" data-tab="usage">الاستخدام والتكلفة</button>
  </div>

  <div id="tab-dashboard" class="tab-panel"></div>
  <div id="tab-pharmacies" class="tab-panel" style="display:none;"></div>
  <div id="tab-plans" class="tab-panel" style="display:none;"></div>
  <div id="tab-features" class="tab-panel" style="display:none;"></div>
  <div id="tab-access" class="tab-panel" style="display:none;"></div>
  <div id="tab-ads" class="tab-panel" style="display:none;"></div>
  <div id="tab-usage" class="tab-panel" style="display:none;"></div>
</main>

<!-- Pharmacy detail overlay -->
<div class="overlay" id="pharmacyOverlay">
  <div class="modal">
    <div class="modal-head"><h3>تفاصيل الصيدلية</h3><button class="btn btn-ghost btn-icon" id="closePharmacyOverlay">✕</button></div>
    <div class="modal-body" id="pharmacyOverlayBody"></div>
  </div>
</div>

<!-- Ad editor overlay -->
<div class="overlay" id="adOverlayModal">
  <div class="modal">
    <div class="modal-head"><h3 id="adEditorTitle">إعلان جديد</h3><button class="btn btn-ghost btn-icon" id="closeAdEditor">✕</button></div>
    <div class="modal-body">
      <div class="field"><label>صورة (اختياري)</label>
        <input type="file" id="adImageInput" accept="image/*">
        <div id="adImagePreview" style="margin-top:8px;"></div>
      </div>
      <div class="field"><label>رابط فيديو (اختياري)</label><input type="text" id="adVideoUrl" placeholder="https://..."></div>
      <div class="field"><label>نص الإعلان (اختياري)</label><textarea id="adText"></textarea></div>
      <div class="field"><label>الاستهداف الجغرافي (فارغ = كل المحافظات)</label>
        <div id="adProvinceChips" style="display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px;"></div>
        <div style="display:flex; gap:8px;">
          <input type="text" id="adProvinceInput" placeholder="اسم محافظة">
          <button type="button" class="btn btn-ghost" id="addProvinceBtn">إضافة</button>
        </div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-primary" id="saveAdBtn">حفظ الإعلان</button>
      <button class="btn btn-ghost" id="cancelAdEditor">إلغاء</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-storage-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="shared.js"></script>
<script src="platform.js"></script>
<script>
(function(){
  "use strict";
  var pharmacies=[], plans=[], activationCodes=[], features=[], accessCodes=[], ads=[];
  var currentPharmacyDetailId = null, editingAdId = null, adTargetProvinces = [], adImageFile = null, adExistingImageUrl = null;
  var editingPlanId = null;

  guardPage({ requireSuperAdmin:true, onReady:function(){ loadTheme(); initConnectivityBanner(); init(); } });

  // يُستدعى عند فشل أي مستمع Firestore (غالباً بسبب قواعد أمان غير
  // منشورة بعد، أو مشكلة اتصال) — بدل فشل صامت يترك التبويب فارغاً بلا
  // تفسير، يظهر تنبيهاً واضحاً بنص الخطأ الفعلي من Firebase.
  function onListenerError(label){
    return function(err){
      showToast("خطأ بجلب بيانات "+label+": "+err.message, true);
      console.error(label, err);
    };
  }

  function init(){
    document.querySelectorAll(".tab-btn").forEach(function(btn){
      btn.onclick=function(){
        document.querySelectorAll(".tab-btn").forEach(function(b){b.classList.remove("active");});
        document.querySelectorAll(".tab-panel").forEach(function(p){p.style.display="none";});
        btn.classList.add("active");
        document.getElementById("tab-"+btn.getAttribute("data-tab")).style.display="block";
      };
    });
    document.getElementById("logoutBtn").onclick=function(){ auth.signOut().then(function(){window.location.href="index.html";}); };

    db.collection("pharmacies").onSnapshot(function(s){ pharmacies=s.docs.map(function(d){return Object.assign({id:d.id},d.data());}); renderDashboard(); renderPharmacies(); renderPlanSelectOptions(); }, onListenerError("الصيدليات"));
    db.collection("subscriptionPlans").onSnapshot(function(s){ plans=s.docs.map(function(d){return Object.assign({id:d.id},d.data());}); renderPlans(); renderPlanSelectOptions(); }, onListenerError("خطط الاشتراك"));
    db.collection("activationCodes").onSnapshot(function(s){ activationCodes=s.docs.map(function(d){return Object.assign({id:d.id},d.data());}); renderActivationCodes(); }, onListenerError("رموز التفعيل"));
    db.collection("features").onSnapshot(function(s){ features=s.docs.map(function(d){return Object.assign({id:d.id},d.data());}); renderFeatures(); }, onListenerError("الميزات"));
    db.collection("accessCodes").orderBy("createdAt","desc").onSnapshot(function(s){ accessCodes=s.docs.map(function(d){return Object.assign({id:d.id},d.data());}); renderAccessCodes(); }, onListenerError("رموز الفتح"));
    db.collection("ads").orderBy("createdAt","desc").onSnapshot(function(s){ ads=s.docs.map(function(d){return Object.assign({id:d.id},d.data());}); renderAds(); }, onListenerError("الإعلانات"));

    document.getElementById("closePharmacyOverlay").onclick=function(){ document.getElementById("pharmacyOverlay").classList.remove("open"); };
    document.getElementById("pharmacyOverlay").onclick=function(e){ if(e.target===this) this.classList.remove("open"); };

    renderAccessTab();
    renderUsageTab();
  }

  // ================= لوحة الإحصائيات =================
  function renderDashboard(){
    var el = document.getElementById("tab-dashboard");
    var activeCount = pharmacies.filter(function(p){return isSubscriptionActive(p.subscription);}).length;
    var expiringSoon = pharmacies.filter(function(p){return isSubscriptionActive(p.subscription) && remainingDays(p.subscription.endDate)<=7;}).length;

    el.innerHTML =
      '<div class="stat-row">'+
        '<div class="stat-card"><div class="value">'+pharmacies.length+'</div><div class="label">إجمالي الصيدليات</div></div>'+
        '<div class="stat-card"><div class="value">'+activeCount+'</div><div class="label">اشتراكات فعّالة</div></div>'+
        '<div class="stat-card"><div class="value">'+expiringSoon+'</div><div class="label">تنتهي خلال 7 أيام</div></div>'+
      '</div>'+
      '<div id="pharmStatsList"></div>';

    var list = document.getElementById("pharmStatsList");
    if(!pharmacies.length){ list.innerHTML='<div class="empty-state">لا توجد صيدليات مسجلة بعد.</div>'; return; }

    list.innerHTML = pharmacies.map(function(p){
      var active = isSubscriptionActive(p.subscription);
      return '<div class="card" style="padding:14px; margin-bottom:10px;">'+
        '<b>'+escapeHtml(p.name)+'</b>'+
        '<p style="font-size:12px; color:var(--ink-faint); margin:4px 0 8px;">'+escapeHtml([p.province,p.district,p.neighborhood].filter(Boolean).join(' — '))+'</p>'+
        '<div style="display:flex; gap:8px; flex-wrap:wrap;">'+
          '<span class="chip chip-muted" data-sub-count="'+p.id+'">جارٍ العد...</span>'+
          '<span class="chip '+(active?'':'chip-danger')+'">'+(active?('متبقي '+remainingDays(p.subscription.endDate)+' يوم'):'لا يوجد اشتراك فعّال')+'</span>'+
        '</div></div>';
    }).join("");

    pharmacies.forEach(function(p){
      db.collection("pharmacies").doc(p.id).collection("subEmails").get().then(function(snap){
        var badge = list.querySelector('[data-sub-count="'+p.id+'"]');
        if(badge) badge.textContent = "إيميلات فرعية: "+snap.size+" / "+p.maxSubEmails;
      });
    });
  }

  // ================= الصيدليات =================
  function renderPharmacies(){
    var el = document.getElementById("tab-pharmacies");
    if(!pharmacies.length){ el.innerHTML='<div class="empty-state">لا توجد صيدليات بعد.</div>'; return; }
    el.innerHTML = '<div class="card">'+pharmacies.map(function(p){
      var active = isSubscriptionActive(p.subscription);
      return '<div class="row" data-id="'+p.id+'">'+
        '<div class="avatar">'+escapeHtml((p.name||"؟").charAt(0))+'</div>'+
        '<div style="flex:1;"><b>'+escapeHtml(p.name)+'</b><p style="font-size:12px; color:var(--ink-faint); margin:2px 0 0;">'+escapeHtml(p.ownerEmail)+'</p></div>'+
        '<span class="chip '+(active?'':'chip-muted')+'">'+(active?'فعّال':'غير فعّال')+'</span></div>';
    }).join("")+'</div>';
    el.querySelectorAll(".row").forEach(function(row){ row.onclick=function(){ openPharmacyDetail(row.getAttribute("data-id")); }; });
  }

  function openPharmacyDetail(id){
    currentPharmacyDetailId = id;
    renderPharmacyDetailBody();
    document.getElementById("pharmacyOverlay").classList.add("open");
  }

  async function renderPharmacyDetailBody(){
    var p = pharmacies.find(function(x){return x.id===currentPharmacyDetailId;});
    if(!p) return;
    var body = document.getElementById("pharmacyOverlayBody");
    var subEmailsSnap = await db.collection("pharmacies").doc(p.id).collection("subEmails").get();
    var currentPlan = plans.find(function(pl){ return pl.id === p.subscription.planId; });
    var activeNow = p.activeUntil &&
      (p.activeUntil.toDate ? p.activeUntil.toDate() : new Date(p.activeUntil)) > new Date();

    body.innerHTML =
      '<p style="font-size:16px; font-weight:700; margin:0;">'+escapeHtml(p.name)+'</p>'+
      '<p style="color:var(--ink-faint); margin:2px 0 20px;">'+escapeHtml(p.ownerEmail)+'</p>'+

      '<p style="font-weight:700; font-size:13px; margin-bottom:8px;">تفعيل استمرارية البرنامج (مستقل عن خطة الاشتراك)</p>'+
      '<p class="chip '+(activeNow?'':'chip-danger')+'" style="display:inline-block;">'+
        (activeNow ? ('فعّال — متبقي '+remainingDays(p.activeUntil)+' يوم') : 'غير مفعَّل') +
      '</p>'+

      '<div style="border-top:1px solid var(--line-soft); margin:18px 0; padding-top:18px;">'+
        '<p style="font-weight:700; font-size:13px; margin-bottom:8px;">حالة خطة الاشتراك (عدد الإيميلات + الميزات)</p>'+
        '<div style="display:flex; gap:8px; margin-bottom:8px;" id="subStatusButtons">'+
          ['active','expired','none'].map(function(s){
            return '<button type="button" class="chip '+(p.subscription.status===s?'':'chip-muted')+'" data-status="'+s+'" style="cursor:pointer; border:none;">'+s+'</button>';
          }).join("")+
        '</div>'+
        (p.subscription.endDate ? '<p style="font-size:13px; color:var(--ink-faint);">ينتهي: متبقي '+remainingDays(p.subscription.endDate)+' يوم</p>' : '')+
      '</div>'+

      '<div style="border-top:1px solid var(--line-soft); margin:18px 0; padding-top:18px;">'+
        '<p style="font-weight:700; font-size:13px; margin-bottom:8px;">الحد الأقصى للإيميلات الفرعية</p>'+
        '<p style="font-size:13.5px; color:var(--ink-faint); margin:0;">'+
          (p.maxSubEmails || 0) + ' — عبر خطة "' + escapeHtml(currentPlan ? currentPlan.name : 'بلا خطة') + '"' +
        '</p>'+
        '<p style="font-size:12px; color:var(--ink-faint); margin-top:4px;">يُحدَّد هذا الرقم من خطة الاشتراك فقط (تبويب "الخطط والتفعيل") — لم يعد قابلاً للتعديل هنا مباشرة.</p>'+
      '</div>'+

      '<div style="border-top:1px solid var(--line-soft); margin:18px 0; padding-top:18px;">'+
        '<p style="font-weight:700; font-size:13px; margin-bottom:8px;">الإيميلات الفرعية ('+subEmailsSnap.size+')</p>'+
        (subEmailsSnap.empty ? '<p style="color:var(--ink-faint); font-size:13px;">لا توجد إيميلات فرعية.</p>' :
          subEmailsSnap.docs.map(function(d){
            return '<div style="display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--line-soft);"><span class="num">'+escapeHtml(d.id)+'</span><button class="btn btn-icon btn-danger-ghost" data-del-sub="'+d.id+'">✕</button></div>';
          }).join(""))+
      '</div>';

    body.querySelectorAll("[data-status]").forEach(function(btn){
      btn.onclick=async function(){
        var newSub = Object.assign({}, p.subscription, {status:btn.getAttribute("data-status")});
        await db.collection("pharmacies").doc(p.id).update({subscription:newSub});
        showToast("تم تحديث حالة الاشتراك");
      };
    });
    body.querySelectorAll("[data-del-sub]").forEach(function(btn){
      btn.onclick=async function(){
        await db.collection("pharmacies").doc(p.id).collection("subEmails").doc(btn.getAttribute("data-del-sub")).delete();
        renderPharmacyDetailBody();
      };
    });
  }

  // ================= خطط الاشتراك ورموز التفعيل =================
  function renderPlanSelectOptions(){
    var sel = document.getElementById("codePlanSelect");
    if(sel) sel.innerHTML = plans.map(function(pl){ return '<option value="'+pl.id+'">'+escapeHtml(pl.name)+'</option>'; }).join("");
  }

  function renderPlans(){
    var el = document.getElementById("tab-plans");
    el.innerHTML =
      '<div class="mini-form">'+
        '<p style="font-weight:700; margin:0 0 12px;">خطة اشتراك جديدة</p>'+
        '<div class="field"><label>اسم الخطة</label><input type="text" id="planNameInput"></div>'+
        '<div class="field"><label>الحد الأقصى للإيميلات الفرعية</label><input type="number" id="planMaxSubEmails" value="1"></div>'+
        '<label style="display:flex; align-items:center; gap:8px; font-size:13.5px; margin-bottom:14px;"><input type="checkbox" id="planRemoveAds"> إخفاء الإعلانات لهذه الخطة</label>'+
        '<button class="btn btn-primary" id="createPlanBtn">إنشاء الخطة</button>'+
      '</div>'+
      '<p style="font-weight:700; font-size:13px; color:var(--ink-faint); margin-bottom:10px;">الخطط الحالية</p>'+
      '<div id="plansListArea" style="margin-bottom:26px;"></div>'+
      '<div class="mini-form">'+
        '<p style="font-weight:700; margin:0 0 12px;">رمز تفعيل جديد</p>'+
        '<div class="field"><label>الخطة</label><select id="codePlanSelect"></select></div>'+
        '<div style="display:flex; gap:10px;">'+
          '<div class="field" style="flex:1;"><label>مدة الاشتراك (يوم)</label><input type="number" id="codeDuration" value="30"></div>'+
          '<div class="field" style="flex:1;"><label>الحد الأقصى للاستخدام</label><input type="number" id="codeMaxUses" value="1"></div>'+
        '</div>'+
        '<button class="btn btn-primary" id="createCodeBtn">إنشاء رمز التفعيل</button>'+
      '</div>'+
      '<p style="font-weight:700; font-size:13px; color:var(--ink-faint); margin-bottom:10px;">رموز التفعيل الحالية</p>'+
      '<div class="card" id="activationCodesList"></div>';

    renderPlansList();
    renderPlanSelectOptions();

    document.getElementById("createPlanBtn").onclick=async function(){
      var name = document.getElementById("planNameInput").value.trim();
      var maxSubEmails = parseInt(document.getElementById("planMaxSubEmails").value,10) || 0;
      if(!name) return;
      try{
        await db.collection("subscriptionPlans").add({
          name:name, maxSubEmails:maxSubEmails, features:[], removeAds:document.getElementById("planRemoveAds").checked,
          createdAt:firebase.firestore.FieldValue.serverTimestamp()
        });
        showToast("تم إنشاء الخطة");
      }catch(err){ showToast("تعذّر إنشاء الخطة: "+err.message, true); }
    };
    document.getElementById("createCodeBtn").onclick=async function(){
      var planId = document.getElementById("codePlanSelect").value;
      var duration = parseInt(document.getElementById("codeDuration").value,10);
      var maxUses = parseInt(document.getElementById("codeMaxUses").value,10);
      if(!planId||!duration||!maxUses) { showToast("أنشئ خطة أولاً واملأ الحقول", true); return; }
      var code = generateRandomCode();
      try{
        await db.collection("activationCodes").doc(code).set({
          planId:planId, durationDays:duration, maxUses:maxUses, usedCount:0,
          expiresAt:null, isCancelled:false, usageLog:[], createdAt:firebase.firestore.FieldValue.serverTimestamp()
        });
        showToast("تم إنشاء الرمز: "+code);
      }catch(err){ showToast("تعذّر إنشاء الرمز: "+err.message, true); }
    };
    renderActivationCodes();
  }

  function renderPlansList(){
    var area = document.getElementById("plansListArea");
    if(!area) return;
    if(!plans.length){ area.innerHTML = '<div class="card"><div class="empty-state">لا توجد خطط بعد.</div></div>'; return; }

    area.innerHTML = '<div class="card">' + plans.map(function(pl){
      if(editingPlanId === pl.id){
        return '<div class="row" style="cursor:default; flex-direction:column; align-items:stretch; gap:10px;">'+
          '<div class="field" style="margin:0;"><label>اسم الخطة</label><input type="text" id="editPlanName" value="'+escapeHtml(pl.name)+'"></div>'+
          '<div class="field" style="margin:0;"><label>الحد الأقصى للإيميلات الفرعية</label><input type="number" id="editPlanMaxSubEmails" value="'+(pl.maxSubEmails||0)+'"></div>'+
          '<label style="display:flex; align-items:center; gap:8px; font-size:13px;"><input type="checkbox" id="editPlanRemoveAds" '+(pl.removeAds?'checked':'')+'> إخفاء الإعلانات</label>'+
          '<div style="display:flex; gap:8px;"><button class="btn btn-primary" data-save-plan="'+pl.id+'">حفظ</button><button class="btn btn-ghost" data-cancel-edit-plan="1">إلغاء</button></div>'+
        '</div>';
      }
      return '<div class="row" style="cursor:default;">'+
        '<div style="flex:1;"><b>'+escapeHtml(pl.name)+'</b>'+
          '<p style="font-size:12px; color:var(--ink-faint); margin:2px 0 0;">'+(pl.maxSubEmails||0)+' إيميل فرعي'+(pl.removeAds?' — بدون إعلانات':'')+'</p>'+
        '</div>'+
        '<button class="btn btn-icon btn-ghost" data-edit-plan="'+pl.id+'">✎</button>'+
        '<button class="btn btn-icon btn-danger-ghost" data-del-plan="'+pl.id+'">✕</button>'+
      '</div>';
    }).join('') + '</div>';

    area.querySelectorAll('[data-edit-plan]').forEach(function(btn){
      btn.onclick=function(){ editingPlanId = btn.getAttribute('data-edit-plan'); renderPlansList(); };
    });
    area.querySelectorAll('[data-cancel-edit-plan]').forEach(function(btn){
      btn.onclick=function(){ editingPlanId = null; renderPlansList(); };
    });
    area.querySelectorAll('[data-save-plan]').forEach(function(btn){
      btn.onclick=async function(){
        var id = btn.getAttribute('data-save-plan');
        var name = document.getElementById('editPlanName').value.trim();
        var maxSubEmails = parseInt(document.getElementById('editPlanMaxSubEmails').value,10) || 0;
        var removeAds = document.getElementById('editPlanRemoveAds').checked;
        if(!name) return;
        try{
          await db.collection('subscriptionPlans').doc(id).update({name:name, maxSubEmails:maxSubEmails, removeAds:removeAds});

  // وضع بيانات اعتماد حسّاسة داخل الكود الذي يراه أي زائر). لذلك هذا

        '<a href="'+consoleUrl+'" target="_blank" class="btn btn-primary">فتح Firebase Console</a>' +
      '</div>' +

      '<div class="card" style="padding:16px; margin-bottom:16px;">' +
        '<p style="font-weight:700; margin:0 0 10px;">الخطة المجانية (Spark) — للمرجع</p>' +
        '<div style="font-size:13px; line-height:2;">' +
          '<div>القراءات (Reads): <b>50,000</b> / يوم</div>' +
          '<div>الكتابات (Writes): <b>20,000</b> / يوم</div>' +
          '<div>الحذف (Deletes): <b>20,000</b> / يوم</div>' +
          '<div>التخزين (Firestore): <b>1 GiB</b> إجمالاً</div>' +
          '<div>نقل البيانات الصادر: <b>10 GiB</b> / شهر</div>' +
        '</div>' +
      '</div>' +

      '<div class="card" style="padding:16px;">' +
        '<p style="font-weight:700; margin:0 0 4px;">حاسبة تقدير التكلفة</p>' +
        '<p style="font-size:12px; color:var(--ink-faint); margin:0 0 14px;">انسخ الأرقام من صفحة Usage في Firebase وضعها هنا — ستحسب الآلة تلقائياً هل تجاوزت الخطة المجانية وبكم تقريباً. أسعار الفائض معبّأة مسبقاً من صفحة تسعير Firestore الرسمية، وهي قابلة للتعديل إن تغيّرت — <a href="https://cloud.google.com/firestore/pricing" target="_blank">تحقّق من السعر الحالي هنا</a>.</p>' +

        '<div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">' +
          '<div class="field" style="margin:0;"><label>القراءات اليوم</label><input type="number" id="uReads" value="0"></div>' +
          '<div class="field" style="margin:0;"><label>الكتابات اليوم</label><input type="number" id="uWrites" value="0"></div>' +
          '<div class="field" style="margin:0;"><label>الحذف اليوم</label><input type="number" id="uDeletes" value="0"></div>' +
          '<div class="field" style="margin:0;"><label>التخزين (GiB)</label><input type="number" step="0.01" id="uStorage" value="0"></div>' +
        '</div>' +

        '<p style="font-weight:700; font-size:12.5px; margin:16px 0 8px;">أسعار الفائض (قابلة للتعديل)</p>' +
        '<div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">' +
          '<div class="field" style="margin:0;"><label>$ لكل 100 ألف قراءة</label><input type="number" step="0.001" id="rReads" value="0.03"></div>' +
          '<div class="field" style="margin:0;"><label>$ لكل 100 ألف كتابة</label><input type="number" step="0.001" id="rWrites" value="0.09"></div>' +
          '<div class="field" style="margin:0;"><label>$ لكل 100 ألف حذف</label><input type="number" step="0.001" id="rDeletes" value="0.01"></div>' +
          '<div class="field" style="margin:0;"><label>$ لكل GiB تخزين/شهر</label><input type="number" step="0.001" id="rStorage" value="0.18"></div>' +
        '</div>' +

        '<button class="btn btn-primary btn-block" id="calcUsageBtn" style="margin-top:6px;">احسب</button>' +
        '<div id="usageResult" style="margin-top:16px;"></div>' +
      '</div>';

    document.getElementById("calcUsageBtn").onclick = function(){
      var reads = parseFloat(document.getElementById("uReads").value) || 0;
      var writes = parseFloat(document.getElementById("uWrites").value) || 0;
      var deletes = parseFloat(document.getElementById("uDeletes").value) || 0;
      var storage = parseFloat(document.getElementById("uStorage").value) || 0;
      var rReads = parseFloat(document.getElementById("rReads").value) || 0;
      var rWrites = parseFloat(document.getElementById("rWrites").value) || 0;
      var rDeletes = parseFloat(document.getElementById("rDeletes").value) || 0;
      var rStorage = parseFloat(document.getElementById("rStorage").value) || 0;

      var FREE_READS = 50000, FREE_WRITES = 20000, FREE_DELETES = 20000, FREE_STORAGE = 1;

      var overReads = Math.max(0, reads - FREE_READS);
      var overWrites = Math.max(0, writes - FREE_WRITES);
      var overDeletes = Math.max(0, deletes - FREE_DELETES);
      var overStorage = Math.max(0, storage - FREE_STORAGE);

      var costReads = (overReads / 100000) * rReads;
      var costWrites = (overWrites / 100000) * rWrites;
      var costDeletes = (overDeletes / 100000) * rDeletes;
      var costStorage = overStorage * rStorage;
      var total = costReads + costWrites + costDeletes + costStorage;

      var withinFree = overReads === 0 && overWrites === 0 && overDeletes === 0 && overStorage === 0;

      var rows = [
        ["القراءات", reads, FREE_READS, overReads, costReads],
        ["الكتابات", writes, FREE_WRITES, overWrites, costWrites],
        ["الحذف", deletes, FREE_DELETES, overDeletes, costDeletes],
        ["التخزين (GiB)", storage, FREE_STORAGE, overStorage, costStorage]
      ];

      document.getElementById("usageResult").innerHTML =
        '<p class="chip" style="background:'+(withinFree?'var(--primary-tint)':'var(--danger-tint)')+'; color:'+(withinFree?'var(--primary-dark)':'var(--danger)')+'; font-size:14px; padding:8px 14px;">' +
          (withinFree ? '✓ ضمن الخطة المجانية بالكامل' : '⚠ تجاوزت الخطة المجانية — تقدير التكلفة اليومي: $' + total.toFixed(4) + ' (شهرياً تقريباً: $' + (total*30).toFixed(2) + ')') +
        '</p>' +
        '<div style="margin-top:10px; font-size:12.5px;">' +
          rows.map(function(r){
            return '<div style="display:flex; justify-content:space-between; padding:4px 0; border-bottom:1px solid var(--line-soft);">' +
              '<span>'+r[0]+'</span><span class="num">'+r[1]+' / '+r[2]+ (r[3]>0 ? ' — فائض '+r[3].toFixed(2)+' ($'+r[4].toFixed(4)+')' : ' ✓') +'</span>' +
            '</div>';
          }).join('') +
        '</div>';
    };
  }

    try{
      var ref;
      if(editingAdId){ ref = db.collection("ads").doc(editingAdId); await ref.update(data); }
      else { data.active=true; data.totalViews=0; data.imageUrl=null; data.createdAt=firebase.firestore.FieldValue.serverTimestamp(); ref = await db.collection("ads").add(data); editingAdId = ref.id; }

      if(adImageFile){
        var blob = await compressImage(adImageFile, 1000);
        var storageRef = storage.ref().child("ads/"+editingAdId+"/image.jpg");
        await storageRef.put(blob);
        var url = await storageRef.getDownloadURL();
        await ref.update({imageUrl:url});
      }
      document.getElementById("adOverlayModal").classList.remove("open");
      showToast("تم حفظ الإعلان");
    }catch(err){ showToast("خطأ: "+err.message, true); }
  };

  async function openAdSettings(){
    var doc = await db.collection("adSettings").doc("config").get();
    var current = doc.exists ? (doc.data().maxViewsPerUser||3) : 3;
    var v = prompt("الحد الأقصى لعدد مرات ظهور الإعلان لكل مستخدم:", current);
    if(v===null) return;
    var n = parseInt(v,10);
    if(isNaN(n)||n<1) return;
    await db.collection("adSettings").doc("config").set({maxViewsPerUser:n});
    showToast("تم الحفظ");
  }

  // ================= أدوات مساعدة =================
  function generateRandomCode(){
    var chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789", out="";
    for(var i=0;i<8;i++) out += chars.charAt(Math.floor(Math.random()*chars.length));
    return out;
  }
})();
</script>
