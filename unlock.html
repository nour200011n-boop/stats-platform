<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فتح التطبيق</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0F6E56">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
</head>
<body>

<div class="center-page">
  <div class="card" style="width:100%; max-width:420px;">
    <div class="card-pad">

      <!-- حالة 1: إنشاء الصيدلية (أول شيء، قبل أي تفعيل) -->
      <div id="setupStep" style="display:none;">
        <div style="text-align:center; margin-bottom:20px;">
          <h2 style="font-size:17px; margin:0 0 4px;">بيانات الصيدلية</h2>
          <p style="font-size:13px; color:var(--ink-faint); margin:0;">أنشئ ملف صيدليتك أولاً، ثم فعّلها برمز الاشتراك.</p>
        </div>
        <div class="field" id="field-pname">
          <label>اسم الصيدلية</label>
          <input type="text" id="pName" placeholder="مثال: صيدلية الشفاء">
          <div class="err-msg">الرجاء إدخال اسم الصيدلية.</div>
        </div>
        <div class="field">
          <label>المحافظة</label>
          <input type="text" id="pProvince" placeholder="مثال: بغداد">
        </div>
        <div class="field">
          <label>القضاء</label>
          <input type="text" id="pDistrict">
        </div>
        <div class="field">
          <label>الحي</label>
          <input type="text" id="pNeighborhood">
        </div>
        <button class="btn btn-primary btn-block" id="createPharmacyBtn">إنشاء الصيدلية والمتابعة</button>
      </div>

      <!-- حالة 2: تفعيل الصيدلية برمز الاشتراك -->
      <div id="unlockStep" style="display:none;">
        <div style="text-align:center; margin-bottom:20px;">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--primary);"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <h2 style="font-size:17px; margin:12px 0 4px;">تفعيل الصيدلية</h2>
          <p style="font-size:13px; color:var(--ink-faint); margin:0;">أدخل رمز الاشتراك الذي حصلت عليه لتفعيل استخدام صيدليتك.</p>
        </div>
        <div class="field" id="field-code">
          <input type="text" id="inputCode" placeholder="رمز الاشتراك" style="text-align:center; text-transform:uppercase; font-weight:700; letter-spacing:2px;">
          <div class="err-msg" id="codeErr"></div>
        </div>
        <button class="btn btn-primary btn-block" id="redeemBtn">تفعيل الصيدلية</button>
      </div>

    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-storage-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="shared.js"></script>
<script src="platform.js"></script>
<script>
(function(){
  "use strict";
  loadTheme();
  initConnectivityBanner();

  // زر/إيماءة الرجوع من هذه الصفحة يجب أن يعيد المستخدم فعلياً لصفحة
  // تسجيل الدخول (وليس مجرد عرضها ثم إعادة توجيهه تلقائياً لهنا من جديد،
  // لأن الجلسة لا تزال فعّالة) — لذلك نسجّل خروجه أولاً عند الرجوع.
  history.pushState({ page: "unlock" }, "", location.href);
  window.addEventListener("popstate", function(){
    auth.signOut().then(function(){
      window.location.href = "index.html";
    });
  });

  var currentUser = null;
  var currentPharmacyId = null;

  auth.onAuthStateChanged(function(user){
    if(!user){ window.location.href = "index.html"; return; }
    currentUser = user;
    checkState();
  });

  async function checkState(){
    var snap = await db.collection("users").doc(currentUser.uid).get();
    var data = snap.exists ? snap.data() : {};

    if(!data.pharmacyId){
      // قبل عرض نموذج "إنشاء صيدلية جديدة": تحقّق هل هذا الإيميل مُضاف
      // كإيميل فرعي لصيدلية موجودة أصلاً — إن كان كذلك، اربطه بها
      // تلقائياً بدل جعله ينشئ صيدلية منفصلة بالخطأ.
      var invitedPharmacyId = await findPharmacyIdForSubEmail(currentUser.email);
      if(invitedPharmacyId){
        await db.collection("users").doc(currentUser.uid).set({
          pharmacyId: invitedPharmacyId, role: "staff"
        }, { merge: true });
        showToast("تم ربط حسابك تلقائياً بصيدلية موجودة");
        checkState();
        return;
      }
      document.getElementById("setupStep").style.display = "block";
      document.getElementById("unlockStep").style.display = "none";
      return;
    }

    currentPharmacyId = data.pharmacyId;
    var pSnap = await db.collection("pharmacies").doc(currentPharmacyId).get();
    var pData = pSnap.exists ? pSnap.data() : {};
    var active = pData.activeUntil &&
      (pData.activeUntil.toDate ? pData.activeUntil.toDate() : new Date(pData.activeUntil)) > new Date();

    if(active){
      window.location.href = "app.html";
      return;
    }
    document.getElementById("setupStep").style.display = "none";
    document.getElementById("unlockStep").style.display = "block";
  }

  // ---------------- إنشاء الصيدلية (أولاً) ----------------
  document.getElementById("createPharmacyBtn").addEventListener("click", async function(){
    var name = document.getElementById("pName").value.trim();
    var field = document.getElementById("field-pname");
    field.classList.toggle("has-error", !name);
    if(!name) return;

    var btn = document.getElementById("createPharmacyBtn");
    btn.disabled = true;
    btn.textContent = "...";

    try{
      var pharmacyRef = db.collection("pharmacies").doc();
      await pharmacyRef.set({
        name: name,
        ownerEmail: currentUser.email,
        province: document.getElementById("pProvince").value.trim(),
        district: document.getElementById("pDistrict").value.trim(),
        neighborhood: document.getElementById("pNeighborhood").value.trim(),
        activeUntil: null,
        maxSubEmails: 0,
        subscription: { planId: null, status: "none", startDate: null, endDate: null, queuedPlanId: null, queuedDurationDays: null },
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      await db.collection("users").doc(currentUser.uid).set({
        pharmacyId: pharmacyRef.id,
        role: "owner"
      }, { merge: true });

      currentPharmacyId = pharmacyRef.id;
      document.getElementById("setupStep").style.display = "none";
      document.getElementById("unlockStep").style.display = "block";
    }catch(err){
      showToast("حدث خطأ: " + err.message, true);
    }finally{
      btn.disabled = false;
      btn.textContent = "إنشاء الصيدلية والمتابعة";
    }
  });

  // ---------------- تفعيل الصيدلية برمز الاشتراك ----------------
  document.getElementById("redeemBtn").addEventListener("click", async function(){
    var codeInput = document.getElementById("inputCode");
    var code = codeInput.value.trim().toUpperCase();
    var errBox = document.getElementById("codeErr");
    var field = document.getElementById("field-code");
    field.classList.remove("has-error");

    if(!code){
      field.classList.add("has-error");
      errBox.textContent = "الرجاء إدخال رمز الاشتراك.";
      return;
    }

    var btn = document.getElementById("redeemBtn");
    btn.disabled = true;
    btn.textContent = "...";

    try{
      await activatePharmacyAccessCode(code, currentPharmacyId);
      showToast("تم تفعيل صيدليتك بنجاح!");
      window.location.href = "app.html";
    }catch(err){
      field.classList.add("has-error");
      errBox.textContent = err.message;
      btn.disabled = false;
      btn.textContent = "تفعيل الصيدلية";
    }
  });
})();
</script>
</body>
</html>
