<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فتح التطبيق</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="center-page">
  <div class="card" style="width:100%; max-width:420px;">
    <div class="card-pad">

      <!-- حالة 1: إدخال رمز الفتح -->
      <div id="unlockStep">
        <div style="text-align:center; margin-bottom:20px;">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--primary);"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <h2 style="font-size:17px; margin:12px 0 4px;">فتح التطبيق</h2>
          <p style="font-size:13px; color:var(--ink-faint); margin:0;">أدخل رمز فتح البرنامج الذي حصلت عليه لبدء الاستخدام.</p>
        </div>
        <div class="field" id="field-code">
          <input type="text" id="inputCode" placeholder="رمز الفتح" style="text-align:center; text-transform:uppercase; font-weight:700; letter-spacing:2px;">
          <div class="err-msg" id="codeErr"></div>
        </div>
        <button class="btn btn-primary btn-block" id="redeemBtn">فتح التطبيق</button>
      </div>

      <!-- حالة 2: إنشاء الصيدلية -->
      <div id="setupStep" style="display:none;">
        <div style="text-align:center; margin-bottom:20px;">
          <h2 style="font-size:17px; margin:0 0 4px;">بيانات الصيدلية</h2>
          <p style="font-size:13px; color:var(--ink-faint); margin:0;">أنشئ ملف صيدليتك لتبدأ بتسجيل المراجعين.</p>
        </div>
        <div class="field" id="field-pname">
          <label>اسم الصيدلية</label>
          <input type="text" id="pName" placeholder="مثال: صيدلية الشفاء">
          <div class="err-msg">الرجاء إدخال اسم الصيدلية.</div>
        </div>
        <div class="field">
          <label>المحافظة</label>
          <input type="text" id="pProvince" placeholder="مثال: بغداد">
        </div>
        <div class="field">
          <label>القضاء</label>
          <input type="text" id="pDistrict">
        </div>
        <div class="field">
          <label>الحي</label>
          <input type="text" id="pNeighborhood">
        </div>
        <button class="btn btn-primary btn-block" id="createPharmacyBtn">إنشاء الصيدلية والمتابعة</button>
      </div>

    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-storage-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="shared.js"></script>
<script>
(function(){
  "use strict";
  loadTheme();

  // زر/إيماءة الرجوع من هذه الصفحة يجب أن يعيد المستخدم فعلياً لصفحة
  // تسجيل الدخول (وليس مجرد عرضها ثم إعادة توجيهه تلقائياً لهنا من جديد،
  // لأن الجلسة لا تزال فعّالة) — لذلك نسجّل خروجه أولاً عند الرجوع.
  history.pushState({ page: "unlock" }, "", location.href);
  window.addEventListener("popstate", function(){
    auth.signOut().then(function(){
      window.location.href = "index.html";
    });
  });

  var currentUser = null;

  auth.onAuthStateChanged(function(user){
    if(!user){ window.location.href = "index.html"; return; }
    currentUser = user;
    checkState();
  });

  async function checkState(){
    var snap = await db.collection("users").doc(currentUser.uid).get();
    var data = snap.exists ? snap.data() : {};
    var unlocked = data.unlockedUntil &&
      (data.unlockedUntil.toDate ? data.unlockedUntil.toDate() : new Date(data.unlockedUntil)) > new Date();

    if(unlocked && data.pharmacyId){
      window.location.href = "app.html";
      return;
    }
    if(unlocked){
      document.getElementById("unlockStep").style.display = "none";
      document.getElementById("setupStep").style.display = "block";
    }
  }

  // ---------------- فك رمز الفتح ----------------
  document.getElementById("redeemBtn").addEventListener("click", async function(){
    var codeInput = document.getElementById("inputCode");
    var code = codeInput.value.trim().toUpperCase();
    var errBox = document.getElementById("codeErr");
    var field = document.getElementById("field-code");
    field.classList.remove("has-error");

    if(!code){
      field.classList.add("has-error");
      errBox.textContent = "الرجاء إدخال رمز الفتح.";
      return;
    }

    var btn = document.getElementById("redeemBtn");
    btn.disabled = true;
    btn.textContent = "...";

    try{
      await redeemAccessCode(code, currentUser.email, currentUser.uid);
      showToast("تم فتح التطبيق بنجاح!");
      document.getElementById("unlockStep").style.display = "none";
      document.getElementById("setupStep").style.display = "block";
    }catch(err){
      field.classList.add("has-error");
      errBox.textContent = err.message;
    }finally{
      btn.disabled = false;
      btn.textContent = "فتح التطبيق";
    }
  });

  async function redeemAccessCode(code, email, uid){
    var codeRef = db.collection("accessCodes").doc(code);
    var userRef = db.collection("users").doc(uid);

    return db.runTransaction(async function(t){
      var codeSnap = await t.get(codeRef);
      if(!codeSnap.exists) throw new Error("رمز الفتح غير صحيح.");
      var c = codeSnap.data();
      if(c.isCancelled) throw new Error("تم إلغاء هذا الرمز.");
      if((c.usedByEmails || []).indexOf(email) > -1) throw new Error("تم استخدام هذا الرمز مسبقاً بهذا الحساب.");
      if((c.usedCount || 0) >= c.maxUses) throw new Error("تم استنفاد عدد مرات استخدام هذا الرمز.");

      var unlockedUntil = new Date(Date.now() + c.durationDays * 86400000);

      t.update(codeRef, {
        usedCount: firebase.firestore.FieldValue.increment(1),
        usedByEmails: firebase.firestore.FieldValue.arrayUnion(email)
      });
      t.set(userRef, {
        unlockedUntil: firebase.firestore.Timestamp.fromDate(unlockedUntil),
        accessCodeUsed: code
      }, { merge: true });
    });
  }

  // ---------------- إنشاء الصيدلية ----------------
  document.getElementById("createPharmacyBtn").addEventListener("click", async function(){
    var name = document.getElementById("pName").value.trim();
    var field = document.getElementById("field-pname");
    field.classList.toggle("has-error", !name);
    if(!name) return;

    var btn = document.getElementById("createPharmacyBtn");
    btn.disabled = true;
    btn.textContent = "...";

    try{
      var pharmacyRef = db.collection("pharmacies").doc();
      await pharmacyRef.set({
        name: name,
        ownerEmail: currentUser.email,
        province: document.getElementById("pProvince").value.trim(),
        district: document.getElementById("pDistrict").value.trim(),
        neighborhood: document.getElementById("pNeighborhood").value.trim(),
        maxSubEmails: 1,
        subscription: { planId: null, status: "none", startDate: null, endDate: null, queuedPlanId: null, queuedDurationDays: null },
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      await db.collection("users").doc(currentUser.uid).set({
        pharmacyId: pharmacyRef.id,
        role: "owner"
      }, { merge: true });

      window.location.href = "app.html";
    }catch(err){
      showToast("حدث خطأ: " + err.message, true);
      btn.disabled = false;
      btn.textContent = "إنشاء الصيدلية والمتابعة";
    }
  });
})();
</script>
</body>
</html>
